user player player;
worker_processes 1;
worker_shutdown_timeout 5s;
pid /run/nginx.pid;
error_log /run/player/nginx-error.log warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 15;
  map_hash_bucket_size 128;
  map $server_addr $player_presentation {
    default video;
    include /run/player-network/presentation.map;
  }
  map $player_presentation $player_root {
    default /usr/share/player;
    still /usr/share/player/still;
  }
  map $player_presentation $player_hls_root {
    default /run/player;
    still /usr/share/player/still;
  }
  server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    server_name _;
    root $player_root;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-PiPlayer-Mode $player_presentation always;
    location /hls/ {
      # In still mode no hls directory exists under the selected read-only root.
      root $player_hls_root;
      try_files $uri =404;
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
    }
    location = /stream.m3u8 {
      root $player_hls_root;
      try_files $uri =404;
      types { application/vnd.apple.mpegurl m3u8; }
    }
    location = /still-image.jpg {
      root /data;
      try_files /still/image.jpg /placeholder.svg;
    }
    location = /status.json {
      alias /run/player/status.json;
      default_type application/json;
    }
  }
}

