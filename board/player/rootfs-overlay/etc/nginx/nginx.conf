user player player;
worker_processes 1;
pid /run/nginx.pid;
error_log /run/player/nginx-error.log warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 15;
  server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/player;
    index index.html;
    location /hls/ {
      alias /run/player/hls/;
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      add_header Cache-Control "no-store" always;
    }
    location = /status.json {
      alias /run/player/status.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }
  }
}

