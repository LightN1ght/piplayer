image boot.vfat {
  vfat {
    extraargs = "-F 32"
    files = {
      "Image",
      "bcm2711-rpi-4-b.dtb",
      "rpi-firmware/start4.elf",
      "rpi-firmware/fixup4.dat",
      "rpi-firmware/config.txt",
      "cmdline.txt"
    }
    file overlays/disable-bt.dtbo {
      image = "rpi-firmware/overlays/disable-bt.dtbo"
    }
  }
  size = 64M
}
image sdcard.img {
  hdimage {
    disk-signature = 0x504c4159
  }
  partition boot {
    partition-type = 0xC
    bootable = true
    image = "boot.vfat"
    offset = 1M
  }
  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}

